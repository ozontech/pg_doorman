include "@SCHEMA@/core.schema"
include "@SCHEMA@/cosine.schema"
include "@SCHEMA@/inetorgperson.schema"
pidfile "@DIRECTORY@/slapd.pid"
argsfile "@DIRECTORY@/slapd.args"
TLSCACertificateFile "@DIRECTORY@/ca.pem"
TLSCertificateFile "@DIRECTORY@/server.pem"
TLSCertificateKeyFile "@DIRECTORY@/server.key"
TLSVerifyClient never

database mdb
maxsize 10485760
suffix @BASE_DN@
rootdn @ADMIN_DN@
rootpw {SHA}BTjsdQi9ssgnbbppFeq9OcJ9MQM=
directory "@DIRECTORY@/data"
index objectClass eq
index uid eq
access to attrs=userPassword
    by anonymous auth
    by self write
    by * none
access to *
    by users read
    by * none
